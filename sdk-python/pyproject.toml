[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explicit-decision-protocol"
version = "0.2.0"
description = "Reference Python SDK for the Explicit Decision Protocol (EDP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Igor Larrat" }]
keywords = ["llm", "agents", "mcp", "decisions", "adr", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastmcp>=3.3,<4.0",
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio",
  "ruff",
  "mypy",
]
langgraph = [
  "langchain>=1.1,<2.0",
  "langgraph>=0.2,<1.0",
]
pydantic-ai = [
  "pydantic-ai>=0.0.13,<1.0",
]
verifier = [
  # Pre-action verifier (spec §3.6 v0.2 extension) — calls Haiku-class model
  # to check planned tool calls against active invariants. Uses the
  # claude_agent_sdk so auth flows through `claude` CLI subscription OR
  # ANTHROPIC_API_KEY (same path the main Claude Code agent uses) — no
  # separate API-key requirement when the user is logged into Claude Code.
  # Optional install: `pip install explicit-decision-protocol[verifier]`.
  "claude-agent-sdk>=0.2,<1.0",
]

[project.scripts]
edp = "edp.cli:app"
edp-mcp-server = "edp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["edp"]

[project.urls]
Homepage = "https://github.com/Isk4R1oT/edp"
Specification = "https://github.com/Isk4R1oT/edp/blob/main/SPEC.md"
Issues = "https://github.com/Isk4R1oT/edp/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
